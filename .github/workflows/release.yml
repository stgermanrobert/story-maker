name: Build portable release

# Publicación automática:
#   cada push a main que cambie story_maker.pyw o CHANGELOG.md mira APP_VERSION;
#   si todavía no existe el tag vX.Y.Z, compila el zip portable en Windows y publica la
#   release con ese tag, el zip, su SHA-256 y las notas tomadas del CHANGELOG.
# También funciona si se publica una release a mano desde GitHub (adjunta el zip),
# y a mano desde la pestaña Actions (deja el zip como artifact, sin publicar).
on:
  push:
    branches: [main]
    paths: ["story_maker.pyw", "CHANGELOG.md"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Versión fija de FFmpeg para que cada build sea reproducible (se actualiza a mano).
  FFMPEG_VERSION: "9.0.2"
  PYTHON_VERSION: "3.12"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide what to do
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          ver=$(sed -nE 's/^APP_VERSION = "([^"]+)".*/\1/p' story_maker.pyw)
          [ -n "$ver" ] || { echo "::error::No encuentro APP_VERSION en story_maker.pyw"; exit 1; }
          tag="v$ver"; build=false; publish=false
          case "$EVENT" in
            release)
              [ "$REF_NAME" = "$tag" ] || { echo "::error::El tag $REF_NAME no coincide con APP_VERSION = $ver"; exit 1; }
              build=true; publish=true ;;
            push)
              if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
                echo "El tag $tag ya existe: no hay versión nueva que publicar."
              else
                echo "Versión nueva: $tag"; build=true; publish=true
              fi ;;
            workflow_dispatch)
              build=true ;;
          esac
          if [ "$publish" = true ] && ! grep -qE "^## \[$ver\]" CHANGELOG.md; then
            echo "::error::Falta la sección '## [$ver]' en CHANGELOG.md"; exit 1
          fi
          { echo "version=$ver"; echo "tag=$tag"; echo "build=$build"; echo "publish=$publish"; } >> "$GITHUB_OUTPUT"

  build-windows:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build app (one folder, no console)
        run: pyinstaller --noconfirm --onedir --windowed --name StoryMaker story_maker.pyw

      - name: Bundle FFmpeg (essentials build, pinned)
        run: |
          $v = $env:FFMPEG_VERSION
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/$v/ffmpeg-$v-essentials_build.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $root = Get-ChildItem ffmpeg_tmp -Directory | Select-Object -First 1
          New-Item -ItemType Directory dist/StoryMaker/bin, dist/StoryMaker/licenses -Force | Out-Null
          # Solo ffmpeg y ffprobe: en Windows el audio de la vista previa no usa ffplay
          Copy-Item "$($root.FullName)/bin/ffmpeg.exe", "$($root.FullName)/bin/ffprobe.exe" dist/StoryMaker/bin/
          Get-ChildItem $root.FullName -Filter "LICENSE*" | ForEach-Object {
            Copy-Item $_.FullName "dist/StoryMaker/licenses/FFmpeg-$($_.Name).txt"
          }
          Write-Host "FFmpeg build: $($root.Name)"

      - name: "Bundle yt-dlp (latest on purpose, YouTube changes often)"
        run: |
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile dist/StoryMaker/bin/yt-dlp.exe
          Invoke-WebRequest https://raw.githubusercontent.com/yt-dlp/yt-dlp/master/LICENSE -OutFile dist/StoryMaker/licenses/yt-dlp-LICENSE.txt

      - name: Add docs and licenses
        run: |
          Copy-Item LICENSE dist/StoryMaker/licenses/StoryMaker-LICENSE.txt
          Copy-Item THIRD_PARTY_NOTICES.md, README.md, README.es.md, CHANGELOG.md dist/StoryMaker/

      - name: Smoke test bundled binaries
        run: |
          dist/StoryMaker/bin/ffmpeg.exe -hide_banner -version | Select-Object -First 1
          dist/StoryMaker/bin/ffprobe.exe -hide_banner -version | Select-Object -First 1
          dist/StoryMaker/bin/yt-dlp.exe --version

      - name: Zip and checksum
        id: zip
        run: |
          $name = "StoryMaker-$env:TAG-win64.zip"
          Compress-Archive -Path dist/StoryMaker -DestinationPath $name -CompressionLevel Optimal
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content SHA256SUMS.txt -Encoding ascii -NoNewline
          "name=$name" >> $env:GITHUB_OUTPUT
          # Tamaños reales, para el registro
          $app = (Get-ChildItem dist/StoryMaker -Recurse -File | Where-Object { $_.DirectoryName -notlike '*\bin' } | Measure-Object Length -Sum).Sum
          $bin = (Get-ChildItem dist/StoryMaker/bin -File | Measure-Object Length -Sum).Sum
          $zip = (Get-Item $name).Length
          Write-Host ("App (Python + Tk + código): {0:N1} MiB" -f ($app / 1MB))
          Write-Host ("bin (FFmpeg + yt-dlp):      {0:N1} MiB" -f ($bin / 1MB))
          Write-Host ("Zip final:                  {0:N1} MiB" -f ($zip / 1MB))
          Write-Host "SHA-256: $hash"

      - name: Release notes from CHANGELOG
        if: env.PUBLISH == 'true'
        run: |
          $ver = $env:TAG.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($ver))\][^\n]*\n(.*?)(?=^## \[|\z)")
          $body = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Story Maker $ver" }
          $body += "`n`n---`n**Download:** ``StoryMaker-$env:TAG-win64.zip`` → unzip → run ``StoryMaker.exe``. FFmpeg $env:FFMPEG_VERSION and yt-dlp included."
          $body += "`n`nSHA-256: ``$((Get-Content SHA256SUMS.txt).Split(' ')[0])``"
          Set-Content notes.md $body -Encoding utf8

      - name: Publish release (creates the tag if needed)
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Story Maker ${{ env.TAG }}
          body_path: notes.md
          make_latest: true
          files: |
            ${{ steps.zip.outputs.name }}
            SHA256SUMS.txt

      - name: Upload artifact (manual runs)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: StoryMaker-win64
          path: |
            ${{ steps.zip.outputs.name }}
            SHA256SUMS.txt
